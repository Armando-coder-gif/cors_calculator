{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <link rel="icon" href="data:,">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>

        {% block title %}

        AgroCognitive

        {% endblock %}

    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bs-stepper/dist/css/bs-stepper.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

    <main>

        {% block content %}

        {% endblock %}

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bs-stepper/dist/js/bs-stepper.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        window.APP_URLS = {
            staticUrl: "{% static '' %}",
            countriesApi: "{% url 'countries' %}",
            calculate: "{% url 'calculate' %}",
            previewReport: "{% url 'preview_report' %}",
            downloadPdf: "{% url 'download_pdf' %}",
            sendPdfEmail: "{% url 'send_pdf_email' %}"
        };
    </script>

    <script src="{% static 'js/i18n.js' %}"></script>
    <script src="{% static 'js/stepper.js' %}"></script>
    <script src="{% static 'js/crop.js' %}"></script>
    <script src="{% static 'js/calculator.js' %}"></script>

</html>
