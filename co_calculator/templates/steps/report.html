<div id="report" class="content">

    <h2 class="mb-2 fw-bold" data-i18n="results_title">
        Tu diagnóstico financiero
    </h2>

    <p class="text-muted mb-4" data-i18n="results_subtitle">
        Revisa tu reporte antes de descargarlo o enviarlo.
    </p>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
            <iframe id="reportPreview" style="width:100%; height:500px; border:none;"></iframe>
        </div>
    </div>

    <button class="btn btn-secondary previous mt-2" data-i18n="btn_back">
        Atrás
    </button>

    <button class="btn btn-agro mt-2 ms-2" id="downloadPdfBtn" data-i18n="results_download_pdf">
        📄 Descargar PDF
    </button>

    <button class="btn btn-agro mt-2 ms-2" id="sendEmailBtn" data-i18n="results_send_email">
        ✉️ Enviar por correo
    </button>

</div>
