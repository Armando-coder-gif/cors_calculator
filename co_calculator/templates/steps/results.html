<div id="volume" class="content">

    <h2 class="mb-4 fw-bold" data-i18n="results_title">
    </h2>

    <!-- Cuadro principal FOMO -->
    <div class="card border-0 shadow mb-4" style="background: #575757">

        <div class="card-body text-center py-5">

            <p class="text-uppercase small mb-1" style="color: #fff; letter-spacing: 2px" data-i18n="results_money_label">

            </p>

            <h1 class="fw-bold mb-2" style="color: #fff; font-size: 3rem" id="moneyLeft" data-i18n="results_money_default">

            </h1>

        </div>

    </div>

    <!-- Métricas de impacto -->
    <div class="row g-4 mb-4">

        <div class="col-md-6">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-body text-center py-4">

                    <div style="font-size: 2.5rem" class="mb-2">🌱</div>

                    <div class="text-muted small text-uppercase mb-1" data-i18n="results_hectares_label">Hectáreas que podrías revitalizar</div>

                    <h3 class="fw-bold" style="color: var(--primary-dark)" id="hectaresResult">0 Ha</h3>

                </div>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-body text-center py-4">

                    <div style="font-size: 2.5rem" class="mb-2">☁️</div>

                    <div class="text-muted small text-uppercase mb-1" data-i18n="results_co2_label">CO₂ neto removido</div>

                    <h3 class="fw-bold" style="color: var(--primary-dark)" id="co2Removed">0 tCO₂e</h3>

                </div>

            </div>

        </div>

    </div>

    <!-- Constantes del modelo -->
    <div class="row g-4 mb-4">

        <div class="col-md-4">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-body text-center py-4">

                    <div style="font-size: 2.5rem" class="mb-2">💧</div>

                    <div class="text-muted small text-uppercase mb-1" data-i18n="results_humidity_label">Ratio de humedad</div>

                    <h3 class="fw-bold" style="color: var(--primary-dark)">50%</h3>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-body text-center py-4">

                    <div style="font-size: 2.5rem" class="mb-2">🔥</div>

                    <div class="text-muted small text-uppercase mb-1" data-i18n="results_pyrolysis_label">Rendimiento de pirólisis</div>

                    <h3 class="fw-bold" style="color: var(--primary-dark)">30%</h3>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-body text-center py-4">

                    <div style="font-size: 2.5rem" class="mb-2">🌍</div>

                    <div class="text-muted small text-uppercase mb-1" data-i18n="results_removal_label">Factor de remoción CO₂</div>

                    <h3 class="fw-bold" style="color: var(--primary-dark)">250%</h3>

                </div>

            </div>

        </div>

    </div>

    <!-- Gráfico -->
    <div class="card mb-4 border-0 shadow-sm">

        <div class="card-body py-3">

            <canvas id="fomoChart" height="150"></canvas>

            <small class="text-muted mt-1 d-block" data-i18n="results_chart_note">
                * No incluye inversión en hardware de pirólisis.
            </small>

        </div>

    </div>

    <div class="d-flex justify-content-between mt-4">

        <button class="btn btn-secondary previous py-2 px-4" data-i18n="btn_back">
        </button>

        <button class="btn btn-agro py-2 px-4 next" data-i18n="info_next">
        </button>

    </div>

</div>
