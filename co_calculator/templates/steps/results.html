<div id="volume" class="content">

    <h2 class="mb-4 fw-bold" data-i18n="results_title">
    </h2>

    <!-- Cuadro principal FOMO -->
    <div class="card border-0 shadow mb-4" style="background: var(--primary)">

        <div class="card-body text-center py-5">

            <p class="text-uppercase small mb-1" style="color: #fff; letter-spacing: 2px" data-i18n="results_money_label">

            </p>

            <h1 class="fw-bold mb-2" style="color: #fff; font-size: 3rem" id="moneyLeft">
                $0 USD/Año
            </h1>

        </div>

    </div>

    <!-- Métricas de impacto -->
    <div class="row g-4 mb-4">

        <div class="col-md-6">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-body text-center py-4">

                    <div style="font-size: 2.5rem" class="mb-2">🪵</div>

                    <div class="text-muted small text-uppercase mb-1" data-i18n="results_fbb_label"></div>

                    <h3 class="fw-bold" style="color: var(--primary-dark)" id="fbbResult">0</h3>

                </div>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-body text-center py-4">

                    <div style="font-size: 2.5rem" class="mb-2">☁️</div>

                    <div class="text-muted small text-uppercase mb-1" data-i18n="results_co2_label">CO₂ neto removido</div>

                    <h3 class="fw-bold" style="color: var(--primary-dark)" id="co2Removed">0 toneladas CO₂ₑ</h3>

                </div>

            </div>

        </div>

    </div>

    <!-- Gráfico -->
    <div class="card mb-4 border-0 shadow-sm">

        <div class="card-body py-3">

            <h6 class="fw-bold text-center mb-2" id="chartTitle">
                <span data-i18n="chart_title"></span><span data-bs-toggle="tooltip" data-bs-placement="top" data-i18n-title="asterisk_tooltip" style="cursor:help">*</span>
            </h6>

            <canvas id="fomoChart" height="150"></canvas>

            {% comment %} <small class="text-muted mt-3 d-block fw-semibold" data-i18n="asterisk_tooltip" style="font-style:italic"></small> {% endcomment %}
            <small class="text-muted mt-1 d-block" data-i18n="results_chart_note">
                * No incluye inversión en hardware de pirólisis.
            </small>
            <small class="text-muted d-block" data-i18n="results_legend_humidity">* Ratio de humedad: 50%</small>
            <small class="text-muted d-block" data-i18n="results_legend_pyrolysis">* Rendimiento de pirólisis: 30%</small>
            <small class="text-muted d-block" data-i18n="results_legend_removal">* Factor de remoción CO₂: 2.5x toneladas CO₂</small>

        </div>

    </div>

    <div class="d-flex justify-content-between mt-4">

        <button class="btn btn-secondary previous py-2 px-4" data-i18n="btn_back">
        </button>

        <button class="btn btn-agro py-2 px-4 next" data-i18n="info_next">
        </button>

    </div>

</div>
