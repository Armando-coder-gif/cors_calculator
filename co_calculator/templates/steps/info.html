<div id="info" class="content">

    <h3 class="mb-2 fw-bold">
        Cuéntanos sobre tu empresa
    </h3>

    <p class="text-muted mb-4">
        Para personalizar tu diagnóstico financiero.
    </p>

    <div class="row g-4">

        <div class="col-12">

            <label class="form-label fw-semibold">
                Nombre de la empresa
            </label>

            <input
                id="companyName"
                type="text"
                class="form-control"
                placeholder="Ej. Finca El Roble">

        </div>

        <div class="col-12 col-md-6">

            <label class="form-label fw-semibold">
                Correo electrónico
            </label>

            <input
                id="companyEmail"
                type="email"
                class="form-control"
                placeholder="Ej. contacto@empresa.com">

        </div>

        <div class="col-12 col-md-6">

            <label class="form-label fw-semibold">
                País
            </label>

            <select id="companyCountry" class="form-select">

                <option selected disabled value="">Selecciona un país...</option>
                <option value="CO">Colombia</option>
                <option value="MX">México</option>
                <option value="CR">Costa Rica</option>
                <option value="EC">Ecuador</option>
                <option value="PE">Perú</option>
                <option value="GT">Guatemala</option>
                <option value="HN">Honduras</option>
                <option value="BR">Brasil</option>
                <option value="AR">Argentina</option>
                <option value="CL">Chile</option>
                <option value="ES">España</option>
                <option value="OTHER">Otro</option>

            </select>

        </div>

    </div>

    <div class="d-grid d-md-flex justify-content-md-end mt-5">

        <button class="btn btn-agro py-2 px-4 next" id="nextToCalcBtn">
            SIGUIENTE
        </button>

    </div>

</div>
