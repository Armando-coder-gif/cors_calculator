<div id="hook" class="content">

    <h2 class="mb-1 fw-bold text-center" data-i18n="abatement_title">
        Why Circularity Wins
    </h2>
    <p class="text-muted text-center mb-4" data-i18n="abatement_subtitle">
        Cost of Abatement per Tonne of CO₂ₑ
    </p>

    <!-- Gráfico de barras comparativo (horizontal) -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body py-3">
            <canvas id="abatementChart" height="150"></canvas>
            <small class="text-muted mt-2 d-block" data-i18n="abatement_footnote">
                * Average industry benchmarks for LatAm.
            </small>
        </div>
    </div>

    <div class="card border-0 shadow-sm mb-4" id="abatementSupportCard">
        <div class="card-body py-3 text-center text-muted" data-i18n="abatement_support_text" id="abatementSupportText">
        </div>
    </div>

    <!-- Warning message -->
    <div id="abatementWarningMsg" class="alert alert-warning d-none text-center fw-semibold mb-4" data-i18n="abatement_warning_text">
    </div>

    <!-- Arbitrage message -->
    <div id="arbitrageMsg" class="alert alert-success d-none text-center fw-semibold mb-4" data-i18n="abatement_arbitrage">
        Arbitrage Opportunity: Your removal pays for itself and generates profit.
    </div>

    <!-- Investment Breakdown Toggle -->
    <div class="form-check form-switch d-flex align-items-center justify-content-center gap-2 mb-3">
        <input class="form-check-input" type="checkbox" role="switch" id="investmentToggleBtn">
        <label class="form-check-label" for="investmentToggleBtn" data-i18n="abatement_show_breakdown">
            I would like to see the investment detail
        </label>
    </div>

    <div id="investmentBreakdown" class="card border-0 shadow-sm mb-4" style="display:none">
        <div class="card-body p-4">
            <div class="py-2 border-bottom">
                <div class="d-flex justify-content-between">
                    <span class="fw-semibold" data-i18n="abatement_agrocognitive_group"></span>
                    <span class="fw-bold" id="breakdownServiceTotal">$0</span>
                </div>
                <div class="d-flex justify-content-between ps-3 pt-1">
                    <small class="text-muted" data-i18n="abatement_subscription"></small>
                    <small class="text-muted" id="breakdownSubscription">$0</small>
                </div>
                <div class="d-flex justify-content-between ps-3 pt-1">
                    <small class="text-muted" data-i18n="abatement_management"></small>
                    <small class="text-muted" id="breakdownManagement">$0</small>
                </div>
                <div class="d-flex justify-content-between ps-3 pt-1">
                    <small class="text-muted" data-i18n="abatement_dmrv"></small>
                    <small class="text-muted" id="breakdownDmrv">$0</small>
                </div>
            </div>
            <div class="py-2 border-bottom">
                <div class="d-flex justify-content-between">
                    <span class="fw-semibold" data-i18n="abatement_hardware"></span>
                    <span class="fw-bold" id="breakdownHardware">$0</span>
                </div>
                <div class="d-flex justify-content-between ps-3 pt-1">
                    <small class="text-muted" id="breakdownKilnName">—</small>
                    <small class="text-muted" id="breakdownKilnAmortization"></small>
                </div>
            </div>
            <div class="d-flex justify-content-between py-2 border-bottom">
                <span data-i18n="abatement_labor"></span>
                <span class="fw-bold" id="breakdownLabor">$0</span>
            </div>
            <div class="d-flex justify-content-between py-2 border-bottom">
                <span data-i18n="abatement_logistics"></span>
                <span class="fw-bold" id="breakdownLogistics">$0</span>
            </div>
            <div class="d-flex justify-content-between py-2 border-bottom">
                <span data-i18n="abatement_fbb_production"></span>
                <span class="fw-bold" id="breakdownFbb">$0</span>
            </div>
            <div class="d-flex justify-content-between py-3">
                <span class="fw-bold" data-i18n="abatement_total_investment"></span>
                <span class="fw-bold" style="color: var(--primary-btn-bg-color)" id="breakdownTotal">$0</span>
            </div>
        </div>
    </div>

    <!-- Revenue Breakdown Toggle -->
    <div class="form-check form-switch d-flex align-items-center justify-content-center gap-2 mb-3">
        <input class="form-check-input" type="checkbox" role="switch" id="revenueToggleBtn">
        <label class="form-check-label" for="revenueToggleBtn" data-i18n="abatement_show_revenue">
            Me gustaría ver el detalle de los ingresos por esta inversión
        </label>
    </div>

    <div id="revenueBreakdown" class="card border-0 shadow-sm mb-4" style="display:none">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between py-2 border-bottom">
                <span data-i18n="abatement_revenue_corcs"></span>
                <span class="fw-bold" id="breakdownCorcs">$0</span>
            </div>
            <div class="d-flex justify-content-between py-2 border-bottom">
                <span data-i18n="abatement_revenue_fbb"></span>
                <span class="fw-bold" id="breakdownFbbRevenue">$0</span>
            </div>
            <div class="d-flex justify-content-between py-3">
                <span class="fw-bold" data-i18n="abatement_potential_revenue"></span>
                <span class="fw-bold" style="color: var(--primary-btn-bg-color)" id="breakdownRevenue">$0</span>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between mt-4">
        <button class="btn btn-secondary previous py-2 px-4" data-i18n="btn_back"></button>
        <button class="btn btn-agro py-2 px-4 next" id="goToReportFromHook" data-i18n="info_next"></button>
    </div>

</div>
