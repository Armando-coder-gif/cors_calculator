<div id="hook" class="content">

    <h2 class="mb-2 fw-bold text-center" data-i18n="hook_title">
        ¿Listos para capturar este valor?
    </h2>

    <p class="text-muted text-center mb-4" data-i18n="hook_subtitle">
        Descubre cuánto cuesta implementar la solución.
    </p>

    <div class="d-flex align-items-center justify-content-center mb-4">
        <label class="form-check-label me-3 fw-semibold" for="hookToggle" data-i18n="hook_toggle_label">
            Mostrar costo de implementación AgroCognitive
        </label>
        <div class="form-check form-switch m-0">
            <input class="form-check-input toggle-agro" type="checkbox" role="switch" id="hookToggle">
        </div>
    </div>

    <div id="hookCard" class="card border-0 shadow-sm mb-4" style="display:none">
        <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-center py-3 border-bottom">
                <div>
                    <div class="fw-bold" data-i18n="hook_service_label">AgroCognitive Managed Service</div>
                    <small class="text-muted" data-i18n="hook_service_detail">SaaS + dMRV + Carbon Mgmt</small>
                </div>
                <h4 class="fw-bold mb-0" style="color: var(--primary)" id="hookCost">$0 USD</h4>
            </div>

            <div class="d-flex justify-content-between align-items-center py-3">
                <div>
                    <div class="fw-bold" data-i18n="hook_net_label">Ganancia Neta Potencial</div>
                    <small class="text-muted" data-i18n="hook_net_detail">Después de servicios</small>
                </div>
                <h4 class="fw-bold mb-0" style="color: var(--primary)" id="hookNet">$0 USD</h4>
            </div>

        </div>

        <div class="card-footer bg-transparent border-0 px-4 pb-3">
            <small class="text-muted" data-i18n="hook_disclaimer">
                * No incluye inversión en hardware de pirólisis.
            </small>
        </div>
    </div>

    <div class="d-flex justify-content-between mt-4">

        <button class="btn btn-secondary previous py-2 px-4" data-i18n="btn_back">
            Atrás
        </button>

        <button class="btn btn-agro py-2 px-4 next" id="goToReportFromHook" data-i18n="info_next">
            SIGUIENTE
        </button>

    </div>

</div>
